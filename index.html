<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Расписание НГТУ">
    <link rel="manifest" href="manifest.json">
    <title>Расписание НГТУ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>📅 Расписание НГТУ</h1>
            <div class="group-info" id="groupInfo">АСИ 24-1</div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-day="today">Сегодня</button>
            <button class="tab" data-day="tomorrow">Завтра</button>
            <button class="tab" data-day="week">Неделя</button>
        </nav>

        <main class="content" id="scheduleContent">
            <div class="loading">Загрузка расписания...</div>
        </main>

        <footer class="footer">
            <button id="settingsBtn">⚙️ Настройки</button>
            <button id="teacherBtn">👨‍🏫 Преподаватели</button>
            <button id="refreshBtn">🔄 Обновить</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
